name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jade_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      JADE_SQL_TEST_DB: jade_sql_test

    steps:
      - uses: actions/checkout@v4

      # The runner image carries third-party apt sources this build has no use
      # for, and `apt-get update` fails the whole step when one of them serves
      # a bad index — which Google's Chrome repo is doing now. Dropping them
      # leaves Ubuntu's own repos, which is where libpq-dev comes from.
      - run: |
          sudo rm -f /etc/apt/sources.list.d/*.list
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bundle exec rspec
